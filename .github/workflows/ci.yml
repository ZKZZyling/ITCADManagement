name: Source verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:manager-static
      - run: npm test
      - run: npm run check:release
      - name: Windows script verification
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/check-powershell.ps1
          ./tests/control-state.test.ps1
          ./tests/team-origin.test.ps1
  cad-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ezdxf>=1.3,<2'
      - run: python tests/cad-pipeline.py
